# Which agent (adapter + model) runs each stage. See factory-plan.md section 1.
# Split: Codex does context, gameplan, code review and context update; Claude Code does the rest (see factory-progress.md → Decisions made).
stages:
  plug:                { adapter: none }   # by hand: any agent; Phase 2: `factory plug` command
  context:             { adapter: codex }
  requirements:        { adapter: claude-code }
  gameplan:            { adapter: codex }
  development:         { adapter: claude-code }
  testing:             { adapter: claude-code }
  code_review:         { adapter: codex }
  review_gameplan:     { adapter: claude-code }
  context_update:      { adapter: codex }
  commit:              { adapter: none }   # deterministic, no AI

# Defaults. A project can override them in <project>/.factory/project.yaml.
review:
  threshold: 8      # minimum score out of 10; zero failing tests is always required
  max_loops: 3      # fix loops before handing over to the user
git:
  mode: branch-pr   # branch ticket-xxx + pull request
