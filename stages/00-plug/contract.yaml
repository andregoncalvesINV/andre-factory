# Stage 00: Plug (inputs/outputs contract)
# Connects a project to the factory. Run once per project.
# Per-agent setup (e.g. agent settings files) is done by the orchestrator afterwards, not by this stage.
stage: 00-plug
ticket: none
working_folder: .factory/

inputs:
  required: []                      # works on a bare project
  optional:
    - AGENTS.md                     # gets a "Factory" section (after asking)

outputs:
  - .factory/factory.yaml
  - .factory/.gitignore
  - .factory/context/.gitkeep
  - .factory/tickets/.gitkeep
  - AGENTS.md                       # only if the user agrees
  - .factory/decisions.md           # only if a question was asked
  - .factory/status.json
